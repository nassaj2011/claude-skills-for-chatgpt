name: Validate agent skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all skill manifests
        run: python scripts/validate_skills.py
      - name: Run read-only heuristic skill security scanner
        run: python scripts/audit_skills.py --root skills --fail-on review
      - name: Verify published source catalog hashes
        run: python scripts/provenance.py
      - name: Validate offline ChatGPT Web distribution
        run: python scripts/build_web_kit.py
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Verify historical A/B raw-output integrity
        run: python scripts/evaluate_skills.py --cases evals/pilot_cases.json --baseline evals/runs/pilot-pr-baseline.json --candidate evals/runs/pilot-pr-candidate.json --require-real
      - name: Verify deterministic A/B evaluator fixture
        run: python scripts/evaluate_skills.py --cases evals/fixtures/demo_cases.json --baseline evals/fixtures/demo_baseline.json --candidate evals/fixtures/demo_candidate.json --json
      - name: Validate 29-skill benchmark specification
        run: python scripts/validate_benchmark.py
      - name: Run executable booking transaction and auth checks
        run: python -m unittest discover -s examples/reference-platform/tests -v
      - name: Run offline observability and release-gate checks
        run: python -m unittest discover -s examples/observability-gate -p "test_*.py" -v
      - name: Verify genuine model output integrity for database scenario
        run: python scripts/evaluate_skills.py --cases evals/benchmarks/v04-db-criteria.json --baseline evals/runs/v04-db-baseline.json --candidate evals/runs/v04-db-candidate.json --require-real
      - name: Verify genuine model output integrity for security scenario
        run: python scripts/evaluate_skills.py --cases evals/benchmarks/v04-security-criteria.json --baseline evals/runs/v04-security-baseline.json --candidate evals/runs/v04-security-candidate.json --require-real
      - name: Verify data-governance field inventory and privacy boundaries
        run: python -m unittest discover -s examples/privacy-inventory -p "test_*.py" -v
      - name: Verify isolated bounded HTTP load and percentile checks
        run: python -m unittest discover -s examples/bounded-load -p "test_*.py" -v
      - name: Verify authored SVG, contrast and rights boundaries
        run: python -m unittest discover -s examples/visual-asset -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify dependency-free RTL frontend behavior
        run: node --test examples/frontend-rtl/ui.test.mjs
      - name: Validate browser module syntax
        run: node --check examples/frontend-rtl/ui.mjs
